# Datacyber aggregator compose (agent + ui + optional integrations).
#
# Start order:
#   1. docker compose -f infra/distribution/docker-compose.yaml up -d   # local OCI registry
#   2. docker compose -f infra/object-storage/docker-compose.yaml up -d
#   3. docker compose -f infra/duckdb/docker-compose.yaml up -d
#   4. docker compose -f infra/dagster/docker-compose.yaml up -d
#   5. docker compose up -d
#
# All stacks share external network `infra-datasynk`.
#
# Optional Telegram bot (warehouse Q&A via brain):
#   cp bot_integrations/telegram/.env.example bot_integrations/telegram/.env
#   # set TELEGRAM_BOT_TOKEN in .env
#   docker compose --profile telegram up -d telegram-bot
#
# MinIO object storage (landing zone) lives in the object-storage stack, not this file:
#   cp infra/object-storage/.env.example infra/object-storage/.env
#   docker compose -f infra/object-storage/docker-compose.yaml up -d

name: datacyber

networks:
  infra:
    name: infra-datasynk
    external: true

volumes:
  storage:
    external: true
    name: storage

services:
  telegram-bot:
    profiles:
      - telegram
    build:
      context: ./bot_integrations/telegram
      dockerfile: Dockerfile
    image: ${DATASYN_IMAGE_REGISTRY:-localhost:5000}/${DATASYN_IMAGE_NAMESPACE:-datasyn}/telegram-bot:${DATASYN_IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file:
      - path: ./bot_integrations/telegram/.env
        required: false
    environment:
      BRAIN_BASE_URL: http://brain:8000
    depends_on:
      - brain
    networks:
      - infra

  brain:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${DATASYN_IMAGE_REGISTRY:-localhost:5000}/${DATASYN_IMAGE_NAMESPACE:-datasyn}/brain:${DATASYN_IMAGE_TAG:-latest}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - compose.env
      - .env
    environment:
      LITELLM_PROXY_BASE: ${LITELLM_PROXY_BASE:-http://litellm:4000}
      LITELLM_API_BASE: ${LITELLM_API_BASE:-http://litellm:4000}
    networks:
      - infra
    volumes:
      - ./.env:/project/.env:ro
      - ./skills:/project/skills:ro
      - ./AGENTS.md:/project/AGENTS.md:ro
    command:
      [
        "python",
        "-m",
        "uvicorn",
        "agent.main:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8000",
      ]
    ports:
      - "8002:8000"

  ui:
    build:
      context: ./ui
      dockerfile: Dockerfile
    image: ${DATASYN_IMAGE_REGISTRY:-localhost:5000}/${DATASYN_IMAGE_NAMESPACE:-datasyn}/ui:${DATASYN_IMAGE_TAG:-latest}
    environment:
      VITE_PROXY_TARGET: http://brain:8000
    depends_on:
      - brain
    networks:
      - infra
    ports:
      - "8003:8003"
