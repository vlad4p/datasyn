# Datacyber agent (brain) only. MCP services live in `mcp_servers/docker-compose.yaml`.
#
# Start order:
#   1. docker compose -f mcp_servers/docker-compose.yaml up -d
#   2. docker compose up -d
#
# Both stacks attach to the external network `datacyber_mcp` (created by the MCP compose file).

name: datacyber

networks:
  mcp:
    name: datacyber_mcp
    external: true

services:
  brain:
    build:
      context: .
      dockerfile: Dockerfile
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - compose.env
      - .env
    networks:
      - mcp
    volumes:
      - ./.env:/project/.env:ro
      # Skills (deepagents SkillsMiddleware reads /project/skills/*/SKILL.md per agent/graph.py)
      # and AGENTS.md (system prompt source, see agent/utils/load_prompt.py). Bind-mounted RO so
      # edits are picked up by `docker compose up -d --force-recreate brain` without a rebuild.
      # The Dockerfile bakes both into the image; these mounts override with the live working copy.
      - ./skills:/project/skills:ro
      - ./AGENTS.md:/project/AGENTS.md:ro
    command:
      [
        "python",
        "-m",
        "uvicorn",
        "agent.main:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8000",
      ]
    ports:
      - "8002:8000"
