# Datasyn aggregator compose (agent + ui).
#
# Start order (local dev): ``make -C infra/object-storage up``, ``duckdb up``, ``dagster up`` — see infra/README.md
#   1. docker compose -f infra/object-storage/docker-compose.yaml up -d --build
#   2. docker compose -f infra/duckdb/docker-compose.yaml up -d --build
#   3. docker compose -f infra/dagster/docker-compose.yaml up -d --build
#   4. docker compose up -d --build
# Registry publish (CI / remote): ``make -C infra/distribution publish`` — see INSTALL.md
#
# All stacks share external network `infra-datasynk`.
#
# MinIO object storage (landing zone) lives in the object-storage stack, not this file:
#   cp infra/object-storage/.env.example infra/object-storage/.env
#   docker compose -f infra/object-storage/docker-compose.yaml up -d

name: datasyn

networks:
  infra:
    name: infra-datasynk
    external: true

volumes:
  storage:
    external: true
    name: storage

services:
  brain:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${DATASYN_IMAGE_PREFIX:-datasyn}/brain:${DATASYN_IMAGE_TAG:-latest}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - compose.env
      # Optional: create a repo-root ``.env`` for secrets (gitignored). Omit on CI/servers that inject env elsewhere.
      - path: .env
        required: false
    environment:
      LITELLM_PROXY_BASE: ${LITELLM_PROXY_BASE:-http://litellm:4000}
      LITELLM_API_BASE: ${LITELLM_API_BASE:-http://litellm:4000}
    networks:
      - infra
    volumes:
      - ./skills:/project/skills:ro
      - ./AGENTS.md:/project/AGENTS.md:ro
      - ./reports:/project/reports
    command:
      [
        "uvicorn",
        "agent.main:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8000",
      ]
    ports:
      - "8002:8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s

  ui:
    build:
      context: ./ui
      dockerfile: Dockerfile
    image: ${DATASYN_IMAGE_PREFIX:-datasyn}/ui:${DATASYN_IMAGE_TAG:-latest}
    environment:
      VITE_PROXY_TARGET: http://brain:8000
    depends_on:
      brain:
        condition: service_healthy
    networks:
      - infra
    ports:
      - "8003:8003"
