# Datasyn — brain + UI (single compose for build, push, pull, and run).
#
# Build machine:
#   cp .env.example .env
#   make build-agent && make build-ui && make push
#
# VM (copy docker-compose.yaml + .env + mcp.json — no git clone):
#   docker compose pull && docker compose up -d

name: datasyn

services:
  brain:
    platform: linux/amd64
    build:
      context: .
      dockerfile: Dockerfile
    image: ${DATASYN_IMAGE_PREFIX:-datasyn}/brain:${DATASYN_IMAGE_TAG:-latest}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - .env
    ports:
      - "8002:8000"
    volumes:
      - reports:/project/reports
      - ./mcp.json:/project/mcp.json:ro
    command:
      [
        "uvicorn",
        "agent.main:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8000",
      ]
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  ui:
    platform: linux/amd64
    build:
      context: ./ui
      dockerfile: Dockerfile
    image: ${DATASYN_IMAGE_PREFIX:-datasyn}/ui:${DATASYN_IMAGE_TAG:-latest}
    environment:
      VITE_PROXY_TARGET: http://brain:8000
    depends_on:
      brain:
        condition: service_healthy
    ports:
      - "8003:8003"
    restart: unless-stopped

volumes:
  reports:
