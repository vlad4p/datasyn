# Datacyber agent (brain) only. MCP services live in `mcp_servers/docker-compose.yaml`.
#
# Start order:
#   1. docker compose -f mcp_servers/docker-compose.yaml up -d
#   2. docker compose up -d
#
# Both stacks attach to the external network `datacyber_mcp` (created by the MCP compose file).

name: datacyber

networks:
  mcp:
    name: datacyber_mcp
    external: true

services:
  brain:
    build:
      context: .
      dockerfile: Dockerfile
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - compose.env
      - .env
    networks:
      - mcp
    volumes:
      - ./.env:/project/.env:ro
    command:
      [
        "python",
        "-m",
        "uvicorn",
        "agent.main:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8000",
      ]
    ports:
      - "8002:8000"
