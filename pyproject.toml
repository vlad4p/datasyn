[project]
name = "datasyn"
version = "0.1.0"
description = "Deep Agent API: FastAPI brain, LangChain remote tools, OpenAI-compatible chat"
requires-python = ">=3.11"
dependencies = [
  "deepagents>=0.5",
  "pandas>=2.2",
  "xlrd>=2.0",
  "openpyxl>=3.1",
  "fastapi>=0.115",
  "httpx>=0.27",
  "langchain-core>=0.3",
  "langchain-mcp-adapters>=0.1",
  "langchain-openai>=0.3",
  "langchain-google-genai>=2.0",
  "opentelemetry-api>=1.28",
  "opentelemetry-sdk>=1.28",
  "opentelemetry-exporter-otlp-proto-http>=1.28",
  "opentelemetry-instrumentation-httpx>=0.49b0",
  "python-dotenv>=1.0",
  "uvicorn[standard]>=0.32",
  "langfuse>=3.0",
  "authlib>=1.3",
  "PyJWT>=2.8",
  "itsdangerous>=2.2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["agent*"]

[project.scripts]
datasyn-agent = "agent.runner:main"
datasyn-api = "agent.main:run"
brain-dev = "agent.main:dev"
skills-sync = "agent.skills.cli:main"

[tool.uv]
managed = true
package = true

[dependency-groups]
dev = [
    "pytest>=8.0",
]
# After dependency changes, refresh Docker requirements:
#   uv export --no-dev --frozen -o requirements.txt --no-emit-project --no-hashes --no-annotate
