[project]
name = "datacyber"
version = "0.1.0"
description = "Deep Agent API: FastAPI brain, LangChain remote tools, OpenAI-compatible chat"
requires-python = ">=3.11"
dependencies = [
  "deepagents>=0.5",
  "pandas>=2.2",
  "xlrd>=2.0",
  "openpyxl>=3.1",
  "fastapi>=0.115",
  "httpx>=0.27",
  "langchain-core>=0.3",
  "langchain-mcp-adapters>=0.1",
  "langchain-openai>=0.3",
  "opentelemetry-api>=1.28",
  "opentelemetry-sdk>=1.28",
  "opentelemetry-exporter-otlp-proto-http>=1.28",
  "opentelemetry-instrumentation-httpx>=0.49b0",
  "python-dotenv>=1.0",
  "uvicorn[standard]>=0.32",
  "langfuse>=3.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "jupyter>=1.0",
  "ipykernel>=6.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["agent*"]

[project.scripts]
datacyber-agent = "agent.runner:main"
datacyber-api = "agent.main:run"
