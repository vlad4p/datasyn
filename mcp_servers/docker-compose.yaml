# MCP + data dependencies for Datacyber (run before the agent stack).
# From repo root:  docker compose -f mcp_servers/docker-compose.yaml up -d
# From this dir:    docker compose up -d
#
# DuckDB file locking: only one process may open `warehouse.duckdb` read-write.
# `duckdb-mcp` needs that for ingest/DDL. The optional Local UI (`duckdb-ui`) uses
# compose **profile `ui`** and is **not** started unless you opt in.
#
# Start MCP stack + DuckDB UI (from repo root):
#   docker compose -f mcp_servers/docker-compose.yaml --profile ui up -d
# Same, without repeating `--profile` every time (Compose reads this env var):
#   COMPOSE_PROFILES=ui docker compose -f mcp_servers/docker-compose.yaml up -d
# Or create `mcp_servers/.env` with one line: COMPOSE_PROFILES=ui
# (Compose loads `mcp_servers/.env` when this file is the project compose file.)
#
# Stop `duckdb-ui` (or run without profile `ui`) before agent ingest if you see
# warehouse lock errors — https://duckdb.org/docs/current/connect/concurrency.html
#
# Shares network `infra-datasynk` with root and infra stacks so
# mcp.json hostnames like `duckdb-mcp` resolve.
#
# MinIO (``scrapper-mcp``): use ``SCRAPPER_MINIO_ACCESS_KEY`` / ``SCRAPPER_MINIO_SECRET_KEY``
# (see ``mcp_servers/.env.example``). Do **not** reuse root ``MINIO_ROOT_*`` from Langfuse
# — those often target a different MinIO and cause ``InvalidAccessKeyId`` on
# ``http://datacyber-object-minio:9000`` (``infra/object-storage``; avoid bare ``minio``
# on ``infra-datasynk`` when Langfuse also publishes ``minio``).

name: datacyber-mcp

networks:
  mcp:
    name: infra-datasynk
    external: true

# --- Data layout (validate paths against Dagster / DuckDB code) ---
#
# ``/data`` — named volume ``duckdb_data`` mounted here. Holds ``warehouse.duckdb``
# (the database file). **This named volume is not ``data-local``** — the DB file lives
# under ``/data`` only. Landing-zone files (scrapes, CSVs) live under ``/data-local``.
#
# ``/data-local`` — local mirror for compatibility: host directory ``../data-local`` bind-mounted
# read-only on ``duckdb``, ``duckdb-ui``, ``duckdb-mcp``,
# and read-write on ``scrapper-mcp``. Primary landing-of-record is MinIO object storage
# (service ``minio`` in root compose); ``scrapper-mcp`` mirrors downloaded files there.
# INDEC paths in code default to ``/data-local/indec/...`` for DuckDB ingestion.
#
# ``dagster-mcp`` ``DAGSTER_DEPLOY_VOLUMES`` defaults to only ``duckdb_data:/data``.
# MCP-deployed user-code containers therefore see the warehouse but **not** ``/data-local``
# unless you append a **host-absolute** bind, e.g. in ``mcp_servers/.env``:
#   DAGSTER_DEPLOY_VOLUMES=duckdb_data:/data;/abs/path/datacyber/data-local:/data-local:ro
# ``INDEC_EPH_BASE`` / ``INDEC_EPH_VARIABLES_PDF`` to paths that exist in that container).
#
# ``dagster-mcp`` also mounts ``../infra/dagster`` at ``/dagster-compose`` so
# ``compose_force_recreate`` and ``user_code_refresh`` can drive the host
# ``dagster`` compose project (``dagster_user_code`` service).

services:
  duckdb:
    build:
      context: ../infra/duckdb
      dockerfile: Dockerfile
    restart: unless-stopped
    volumes:
      - duckdb_data:/data
      - storage:/storage:ro
      - ../data-local:/data-local:ro
    environment:
      DUCKDB_PATH: /data/warehouse.duckdb
    networks:
      - mcp

  # Official DuckDB Local UI (``ui`` extension): https://duckdb.org/docs/current/core_extensions/ui.html
  # DuckDB binds 127.0.0.1:4213; socat listens on 4214 in-container → publish host 4213:4214.
  # Host URL (default): http://127.0.0.1:4213
  # Profile `ui`: excluded from plain `up -d` so duckdb-mcp can open the warehouse
  # without conflicting locks (see header comment).
  duckdb-ui:
    profiles:
      - ui
    build:
      context: ../infra/duckdb/ui
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      - duckdb
    ports:
      - "${DUCKDB_UI_PUBLISH_PORT:-4213}:4214"
    environment:
      DUCKDB_PATH: /data/warehouse.duckdb
      DUCKDB_UI_PROXY_PORT: "4214"
      DUCKDB_UI_DUCK_PORT: "4213"
    volumes:
      - duckdb_data:/data
      - storage:/storage:ro
      - ../data-local:/data-local:ro
    networks:
      - mcp

  duckdb-mcp:
    build:
      context: ./duckdb-mcp
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      - duckdb
    ports:
      - "8040:8040"
    env_file:
      - duckdb-mcp/.env
    environment:
      DUCKDB_PATH: /data/warehouse.duckdb
      DATA_LOCAL_ROOT: /data-local
      PORT: "8040"
      HOST: "0.0.0.0"
      MCP_HTTP_PATH: /mcp
    volumes:
      - duckdb_data:/data
      - storage:/storage:ro
      - ../data-local:/data-local:ro
    networks:
      - mcp

  scrapper-mcp:
    build:
      context: ./scrapper-mcp
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8042:8042"
    environment:
      DATA_LOCAL_ROOT: /data-local
      MINIO_SYNC_ENABLED: "true"
      MINIO_ENDPOINT: "${MINIO_ENDPOINT:-http://datacyber-object-minio:9000}"
      # Credentials for ``infra/object-storage`` MinIO only (defaults match its .env.example).
      MINIO_ACCESS_KEY: "${SCRAPPER_MINIO_ACCESS_KEY:-minioadmin}"
      MINIO_SECRET_KEY: "${SCRAPPER_MINIO_SECRET_KEY:-minioadmin123}"
      MINIO_BUCKET: "${MINIO_BUCKET:-data-local}"
      MINIO_SECURE: "${MINIO_SECURE:-false}"
      MINIO_PREFIX: "${MINIO_PREFIX:-}"
      HOST: "0.0.0.0"
      PORT: "8042"
      MCP_HTTP_PATH: /mcp
      HTTP_TIMEOUT_SECONDS: "60"
      HTTP_USER_AGENT: "Datacyber-Scrapper/1.0 (+https://github.com/datacyber)"
    volumes:
      - storage:/storage:ro
      - ../data-local:/data-local
    networks:
      - mcp

  storage-mcp:
    build:
      context: ./storage-mcp
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8044:8044"
    environment:
      MINIO_ENDPOINT: "${MINIO_ENDPOINT:-http://datacyber-object-minio:9000}"
      MINIO_ACCESS_KEY: "${SCRAPPER_MINIO_ACCESS_KEY:-minioadmin}"
      MINIO_SECRET_KEY: "${SCRAPPER_MINIO_SECRET_KEY:-minioadmin123}"
      MINIO_DEFAULT_BUCKET: "${MINIO_BUCKET:-data-local}"
      MINIO_SECURE: "${MINIO_SECURE:-false}"
      HOST: "0.0.0.0"
      PORT: "8044"
      MCP_HTTP_PATH: /mcp
      MAX_TEXT_BYTES: "5242880"
      LIST_PAGE_SIZE: "1000"
    volumes:
      - storage:/storage
    networks:
      - mcp

  # Dagster MCP: scaffolds Dagster projects under `dagster-mcp/projects/` and
  # drives the host Docker daemon (mounted socket) to build images and run/replace
  # project containers. Project containers join the same `infra-datasynk` network
  # so they can reach `duckdb-mcp:8040`, `scrapper-mcp:8042`, etc.
  #
  # Security note: this service mounts /var/run/docker.sock and therefore has
  # full control over the host Docker daemon. Intended for local development.
  dagster-mcp:
    build:
      context: ./dagster-mcp
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8043:8043"
    environment:
      HOST: "0.0.0.0"
      PORT: "8043"
      MCP_HTTP_PATH: /mcp
      # Optional metadata catalog (PostgreSQL): tools catalog_get_schema / catalog_execute_query
      # appear as dagster_catalog_* via LangChain. Prefer DATABASE_URL or CATALOG_DATABASE_URL.
      DATABASE_URL: "${DATABASE_URL:-}"
      CATALOG_DATABASE_URL: "${CATALOG_DATABASE_URL:-}"
      DAGSTER_PROJECTS_ROOT: /projects
      DAGSTER_PROJECT_NETWORK: infra-datasynk
      DAGSTER_IMAGE_PREFIX: dagster
      DAGSTER_CONTAINER_PREFIX: dagster
      DAGSTER_DEFAULT_HOST_PORT: "3001"
      DAGSTER_WEBSERVER_PORT: "3000"
      # External compose stack: mount ``../infra/dagster`` → ``/dagster-compose`` and point here so
      # ``compose_force_recreate`` / ``user_code_refresh`` can recreate ``dagster_user_code``.
      DAGSTER_COMPOSE_FILE: "${DAGSTER_COMPOSE_FILE:-/dagster-compose/docker-compose.yaml}"
      DAGSTER_COMPOSE_PROJECT: "${DAGSTER_COMPOSE_PROJECT:-dagster}"
      DAGSTER_COMPOSE_USER_CODE_SERVICE: "${DAGSTER_COMPOSE_USER_CODE_SERVICE:-dagster_user_code}"
      # ``user_code_refresh``: ``docker build`` context project name + image repo (matches infra ``dagster_user_code``).
      DAGSTER_USER_CODE_BUILD_PROJECT: "${DAGSTER_USER_CODE_BUILD_PROJECT:-datasyn}"
      DAGSTER_USER_CODE_IMAGE_NAME: "${DAGSTER_USER_CODE_IMAGE_NAME:-dagster_user_code_image}"
      # Semicolon-separated ``docker run -v`` sources for MCP ``deploy`` (host daemon).
      # Default: warehouse only. Add ``data-local`` with a **host-absolute** path so
      # user-code sees the same landing zone as ``duckdb-mcp`` (``/data-local/indec/...``).
      # Example (``mcp_servers/.env``): …duckdb_data:/data;storage:/storage;/abs/.../datacyber/data-local:/data-local:ro
      DAGSTER_DEPLOY_VOLUMES: "duckdb_data:/data;storage:/storage"
    volumes:
      - ./dagster-mcp/projects:/projects
      # Infra Dagster stack (host repo ``infra/dagster``) — required for ``compose_force_recreate`` /
      # ``user_code_refresh`` to find ``docker-compose.yaml`` inside the container.
      - ../infra/dagster:/dagster-compose:ro
      # Same landing tree as ``duckdb-mcp`` (read-only); path for ``deploy`` is still set via env above.
      - ../data-local:/data-local:ro
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - mcp

volumes:
  duckdb_data:
    external: true
    name: duckdb_data
  storage:
    external: true
    name: storage