services:
  minio:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - path: ./.env
        required: false
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin123}
    command: ["server", "/data", "--console-address", ":9001"]
    volumes:
      - storage:/data
    # Unique alias: both this stack and ``infra/langfuse`` register the service name
    # ``minio`` on ``infra-datasynk``, so ``minio:9000`` is ambiguous and can hit
    # Langfuse MinIO (root ``minio``/``miniosecret``) while clients use
    # ``minioadmin``/``minioadmin123`` → ``InvalidAccessKeyId``. Use this host for
    # application object storage (Dagster, scrapper, etc.).
    networks:
      infra:
        aliases:
          - datacyber-object-minio

volumes:
  storage:
    external: true
    name: storage

networks:
  infra:
    name: infra-datasynk
    external: true
