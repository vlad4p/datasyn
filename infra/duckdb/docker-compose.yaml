services:
  duckdb:
    build:
      context: ./warehouse
      dockerfile: Dockerfile
    image: ${DATASYN_IMAGE_PREFIX:-datasyn}/duckdb-warehouse:${DATASYN_IMAGE_TAG:-latest}
    restart: unless-stopped
    volumes:
      - duckdb_data:/data
      - storage:/storage:ro
      - ../../data-local:/data-local:ro
    env_file:
      - .env
    networks:
      - infra

  # DuckDB warehouse MCP (FastMCP HTTP). Publishes host :8040 → ``mcp.json`` URL ``http://duckdb-mcp:8040/mcp``.
  duckdb-mcp:
    build:
      context: ./mcp
      dockerfile: Dockerfile
    image: ${DATASYN_IMAGE_PREFIX:-datasyn}/duckdb-mcp:${DATASYN_IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on:
      - duckdb
    ports:
      - "8040:8040"
    env_file:
      - path: ./mcp/.env
        required: false
    environment:
      DUCKDB_PATH: /data/warehouse.duckdb
      DATA_LOCAL_ROOT: /data-local
      PORT: "8040"
      HOST: "0.0.0.0"
      MCP_HTTP_PATH: /mcp
    volumes:
      - duckdb_data:/data
      - storage:/storage:ro
      - ../../data-local:/data-local:ro
    networks:
      - infra

  # DuckDB Local UI. Profile ``ui``: opt-in so the warehouse file is not locked when only batch/MCP run.
  # **Do not run with ``duckdb-mcp``** on the same DB file — stop MCP first:
  # ``docker compose -f infra/duckdb/docker-compose.yaml stop duckdb-mcp``.
  # https://duckdb.org/docs/current/connect/concurrency.html
  # Host URL (default): http://127.0.0.1:4213  →  ``make infra-duckdb-ui-up`` or
  # ``docker compose --profile ui up -d duckdb-ui``
  duckdb-ui:
    profiles:
      - ui
    build:
      context: ./ui
      dockerfile: Dockerfile
    image: ${DATASYN_IMAGE_PREFIX:-datasyn}/duckdb-ui:${DATASYN_IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on:
      - duckdb
    ports:
      - "${DUCKDB_UI_PUBLISH_PORT:-4213}:4214"
    environment:
      DUCKDB_PATH: /data/warehouse.duckdb
      DUCKDB_UI_PROXY_PORT: "4214"
      DUCKDB_UI_DUCK_PORT: "4213"
    volumes:
      - duckdb_data:/data
      - storage:/storage:ro
      - ../../data-local:/data-local:ro
    networks:
      - infra

volumes:
  duckdb_data:
    external: true
    name: duckdb_data
  storage:
    external: true
    name: storage

networks:
  infra:
    name: infra-datasynk
    external: true