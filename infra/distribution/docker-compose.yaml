# OCI Distribution Registry — local Docker image registry.
# Image: https://hub.docker.com/_/registry  (``registry:3``)
#
# From the host: ``docker tag myimage:latest localhost:${REGISTRY_PUBLISH_PORT:-5000}/myimage:latest``
# then ``docker push localhost:${REGISTRY_PUBLISH_PORT:-5000}/myimage:latest``.
# Other containers on ``infra-datasynk`` use ``distribution:5000`` as the registry host.
#
# For HTTP (no TLS), the Docker daemon must list this registry as insecure
# (``insecure-registries``) when pushing from the host.

services:
  distribution:
    image: registry:3
    restart: unless-stopped
    ports:
      - "${REGISTRY_PUBLISH_PORT:-5000}:5000"
    volumes:
      - registry_data:/var/lib/registry
    networks:
      - infra

volumes:
  registry_data:

networks:
  infra:
    name: infra-datasynk
    external: true
