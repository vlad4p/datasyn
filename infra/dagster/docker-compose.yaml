# Aligned with https://github.com/dagster-io/dagster/tree/master/examples/deploy_docker
# Three long-running services (postgres, gRPC code location, webserver, daemon)
# plus per-run containers launched by DockerRunLauncher via /var/run/docker.sock.
#
# Co-location with ../langfuse/docker-compose.yml and ../litellm/docker-compose.yaml:
#   Langfuse binds 3000, 3030, 5432, 6379, 8123, 9000, 9090, 9091 on localhost.
#   LiteLLM  binds 4000 and 127.0.0.1:5434.
#   Dagster webserver is exposed on host port 3001 (mapped to container 3000)
#   so it does not clash with Langfuse on 3000. Postgres is kept internal
#   (no host port) to avoid any clash with the other Postgres services.

services:
  # Postgres DB used by Dagster for run storage, schedule storage, and event log storage.
  dagster_postgresql:
    build:
      context: ./postgres
      dockerfile: Dockerfile
    image: ${DATASYN_IMAGE_PREFIX:-datasyn}/dagster-postgresql:${DATASYN_IMAGE_TAG:-latest}
    pull_policy: never
    container_name: dagster_postgresql
    labels:
      datasyn.dagster.project: datasyn
      datasyn.dagster.component: postgresql
    environment:
      POSTGRES_USER: "postgres_user"
      POSTGRES_PASSWORD: "postgres_password"
      POSTGRES_DB: "postgres_db"
    volumes:
      - dagster-db-data:/var/lib/postgresql/data
    networks:
      - infra
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres_user -d postgres_db"]
      interval: 10s
      timeout: 8s
      retries: 5
    restart: unless-stopped

  # gRPC server that loads user code. DAGSTER_CURRENT_IMAGE tells the DockerRunLauncher
  # to reuse this same image for per-run containers.
  # Build context: sibling ``../datasyn-code`` (``DATASYN_CODE_DIR``) or stub ``user_code/``.
  dagster_user_code:
    build:
      context: ${DATASYN_CODE_DIR:-../../../datasyn-code}
      dockerfile: Dockerfile
    image: ${DATASYN_IMAGE_PREFIX:-datasyn}/dagster_user_code_image:${DATASYN_IMAGE_TAG:-latest}
    pull_policy: never
    container_name: dagster_user_code
    labels:
      datasyn.dagster.project: datasyn
      datasyn.dagster.component: user_code
    restart: always
    # User-code gRPC loads full defs; align with per-run job limits in ``runtime/dagster.yaml``.
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 8G
        reservations:
          cpus: "0.25"
          memory: 512M
    env_file:
      - .env
    environment:
      DAGSTER_POSTGRES_USER: "postgres_user"
      DAGSTER_POSTGRES_PASSWORD: "postgres_password"
      DAGSTER_POSTGRES_DB: "postgres_db"
      DAGSTER_CURRENT_IMAGE: "${DATASYN_IMAGE_PREFIX:-datasyn}/dagster_user_code_image:${DATASYN_IMAGE_TAG:-latest}"
      DUCKDB_PATH: "/data/warehouse.duckdb"
      # LITELLM_KEY / LITELLM_PROXY_BASE come **only** from ``env_file`` (``infra/dagster/.env``).
      # If listed here with ``${VAR:-…}`` the project-root ``.env`` (or host shell exports)
      # silently win and the per-run containers point at the wrong proxy (e.g. 127.0.0.1:4000).
      # MinIO (``infra/object-storage`` stack, alias ``datasyn-object-minio`` on ``infra-datasynk``).
      # Client keys default from ``MINIO_ROOT_*`` when ``MINIO_ACCESS_KEY`` / ``MINIO_SECRET_KEY``
      # are unset so Dagster matches ``MINIO_ROOT_USER`` / ``MINIO_ROOT_PASSWORD`` on the server.
      MINIO_ENDPOINT: "${MINIO_ENDPOINT:-http://datasyn-object-minio:9000}"
      MINIO_ROOT_USER: "${MINIO_ROOT_USER:-}"
      MINIO_ROOT_PASSWORD: "${MINIO_ROOT_PASSWORD:-}"
      MINIO_ACCESS_KEY: "${MINIO_ACCESS_KEY:-${MINIO_ROOT_USER:-minioadmin}}"
      MINIO_SECRET_KEY: "${MINIO_SECRET_KEY:-${MINIO_ROOT_PASSWORD:-minioadmin123}}"
      MINIO_BUCKET: "${MINIO_BUCKET:-data-local}"
      MINIO_SECURE: "${MINIO_SECURE:-false}"
      # Host ``/data-local`` mount root (see ``datasyn.utils.landing_io.data_local_root()``).
      DATA_LOCAL_ROOT: "${DATA_LOCAL_ROOT:-/data-local}"
      # LiteLLM / proxy keys: **only** from ``env_file`` (``.env`` next to this compose file).
      # Do not list them under ``environment`` with ``${VAR:-…}`` — host-shell exports can
      # override ``env_file`` and point user code at the wrong proxy (e.g. 127.0.0.1:4000).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      # Same named volume as Datasyn ``duckdb`` service (warehouse file).
      - duckdb_data:/data
      # Shared object storage volume (MinIO data) for landing access if needed.
      - storage:/storage
      # Absolute host path — set ``DATASYN_DATA_LOCAL_HOST`` in ``.env`` if your tree differs.
      # RW under ``/data-local`` (e.g. ``landing/...``) for assets that mirror to MinIO.
      - ${DATASYN_DATA_LOCAL_HOST:-/Users/vlad/project/datasyn/data-local}:/data-local
    healthcheck:
      # Avoid daemon/webserver gRPC race: they must not connect before ``dagster api grpc``
      # is listening on 4000 (otherwise DagsterUserCodeUnreachableError / UNAVAILABLE).
      test:
        [
          "CMD-SHELL",
          "python -c \"import socket;s=socket.socket();s.settimeout(3);s.connect(('127.0.0.1',4000));s.close()\"",
        ]
      interval: 10s
      timeout: 8s
      retries: 6
      start_period: 120s
    networks:
      - infra

  # dagster-webserver (UI + GraphQL). Uses QueuedRunCoordinator, so runs it submits
  # are queued and later dequeued by dagster-daemon.
  dagster_webserver:
    build:
      context: ./runtime
      dockerfile: Dockerfile
    image: ${DATASYN_IMAGE_PREFIX:-datasyn}/dagster-runtime:${DATASYN_IMAGE_TAG:-latest}
    pull_policy: never
    entrypoint:
      - dagster-webserver
      - -h
      - "0.0.0.0"
      - -p
      - "3000"
      # Explicit workspace: same file is COPY'd to $DAGSTER_HOME by ``runtime/Dockerfile``;
      # default is also ./workspace.yaml when WORKDIR is $DAGSTER_HOME, but -w avoids surprises.
      # - -w
      # - workspace.yaml
    container_name: dagster_webserver
    labels:
      datasyn.dagster.project: datasyn
      datasyn.dagster.component: webserver
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 2G
        reservations:
          cpus: "0.1"
          memory: 256M
    expose:
      - "3000"
    ports:
      - "3001:3000"
    environment:
      DAGSTER_POSTGRES_USER: "postgres_user"
      DAGSTER_POSTGRES_PASSWORD: "postgres_password"
      DAGSTER_POSTGRES_DB: "postgres_db"
      # Same forwarded set as ``dagster_daemon`` so behavior is consistent if the
      # webserver ever launches runs directly.
      # LITELLM_KEY / LITELLM_PROXY_BASE come **only** from ``env_file`` (``infra/dagster/.env``).
      DUCKDB_PATH: "/data/warehouse.duckdb"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      # Host ``runtime/dagster.yaml`` must be live; the runtime image only COPYs at build
      # time. Without this mount, ``env_vars`` (e.g. MINIO_*) stays stale and
      # DockerRunLauncher will not forward them to per-run containers.
      - ./runtime/dagster.yaml:/opt/dagster/dagster_home/dagster.yaml:ro
      - ./runtime/workspace.yaml:/opt/dagster/dagster_home/workspace.yaml:ro
      - /var/run/docker.sock:/var/run/docker.sock
      - /tmp/io_manager_storage:/tmp/io_manager_storage
      - /tmp/dagster_data:/opt/dagster/data
      - duckdb_data:/data
      - storage:/storage
    networks:
      - infra
    depends_on:
      dagster_postgresql:
        condition: service_healthy
      dagster_user_code:
        condition: service_healthy
    restart: unless-stopped

  # dagster-daemon dequeues runs and evaluates schedules/sensors.
  # Same image as ``dagster_webserver`` — only one ``build:`` here so ``docker compose build``
  # does not export ``dagster-runtime`` twice in parallel (BuildKit: "already exists").
  dagster_daemon:
    build:
      context: ./runtime
      dockerfile: Dockerfile
    image: ${DATASYN_IMAGE_PREFIX:-datasyn}/dagster-runtime:${DATASYN_IMAGE_TAG:-latest}
    pull_policy: never
    entrypoint:
      - dagster-daemon
      - run
      # - -w
      # - workspace.yaml
    container_name: dagster_daemon
    labels:
      datasyn.dagster.project: datasyn
      datasyn.dagster.component: daemon
    restart: on-failure
    # Dequeues runs, launches DockerRunLauncher children; give headroom for orchestration + API.
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 4G
        reservations:
          cpus: "0.25"
          memory: 512M
    ## add the .env file to the environment
    env_file:
      - .env
    environment:
      DAGSTER_POSTGRES_USER: "postgres_user"
      DAGSTER_POSTGRES_PASSWORD: "postgres_password"
      DAGSTER_POSTGRES_DB: "postgres_db"
      # ``DockerRunLauncher.env_vars`` forwards these from the daemon's own
      # environment into per-run job containers. Keep in sync with ``dagster.yaml``.
      # LITELLM_KEY / LITELLM_PROXY_BASE come **only** from ``env_file`` (``infra/dagster/.env``)
      # to avoid project-root ``.env`` / host shell shadowing the value (e.g. 127.0.0.1:4000).
      DUCKDB_PATH: "/data/warehouse.duckdb"
      MINIO_ENDPOINT: "${MINIO_ENDPOINT:-http://datasyn-object-minio:9000}"
      MINIO_ROOT_USER: "${MINIO_ROOT_USER:-}"
      MINIO_ROOT_PASSWORD: "${MINIO_ROOT_PASSWORD:-}"
      MINIO_ACCESS_KEY: "${MINIO_ACCESS_KEY:-${MINIO_ROOT_USER:-minioadmin}}"
      MINIO_SECRET_KEY: "${MINIO_SECRET_KEY:-${MINIO_ROOT_PASSWORD:-minioadmin123}}"
      MINIO_BUCKET: "${MINIO_BUCKET:-data-local}"
      MINIO_SECURE: "${MINIO_SECURE:-false}"
      # Landing tree root (read by ``data_local_root()`` in user code).
      DATA_LOCAL_ROOT: "${DATA_LOCAL_ROOT:-/data-local}"
      # Iceberg REST (optional; native DuckDB when unset).
      ICEBERG_REST_ENDPOINT: "${ICEBERG_REST_ENDPOINT:-}"
      ICEBERG_REST_TOKEN: "${ICEBERG_REST_TOKEN:-}"
      ICEBERG_REST_WAREHOUSE: "${ICEBERG_REST_WAREHOUSE:-}"
      ICEBERG_ATTACH_ALIAS: "${ICEBERG_ATTACH_ALIAS:-}"
      ICEBERG_REST_SECRET_NAME: "${ICEBERG_REST_SECRET_NAME:-}"
      ICEBERG_REST_CLIENT_ID: "${ICEBERG_REST_CLIENT_ID:-}"
      ICEBERG_REST_CLIENT_SECRET: "${ICEBERG_REST_CLIENT_SECRET:-}"
      ICEBERG_REST_OAUTH_URI: "${ICEBERG_REST_OAUTH_URI:-}"
      # OpenRouter / LiteLLM: from ``env_file`` only — see comment on ``dagster_user_code``.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./runtime/dagster.yaml:/opt/dagster/dagster_home/dagster.yaml:ro
      - ./runtime/workspace.yaml:/opt/dagster/dagster_home/workspace.yaml:ro
      - /var/run/docker.sock:/var/run/docker.sock
      - /tmp/io_manager_storage:/tmp/io_manager_storage
      - /tmp/dagster_data:/opt/dagster/data
    networks:
      - infra
    depends_on:
      dagster_postgresql:
        condition: service_healthy
      dagster_user_code:
        condition: service_healthy

networks:
  infra:
    name: infra-datasynk
    external: true

volumes:
  dagster-db-data:
  duckdb_data:
    external: true
  storage:
    external: true
