scheduler:
  module: dagster.core.scheduler
  class: DagsterDaemonScheduler

run_coordinator:
  module: dagster.core.run_coordinator
  class: QueuedRunCoordinator

# DuckDB file at DUCKDB_PATH allows only one writer; pool all warehouse assets (see datasynk ``pool=``).
# https://docs.dagster.io/guides/operate/managing-concurrency/concurrency-pools
concurrency:
  pools:
    default_limit: 1
  runs:
    # Single file ``warehouse.duckdb``: two DockerRunLauncher containers must not open it RW at once.
    # Raise only if you move the warehouse off file-backed DuckDB (e.g. MotherDuck) or drop writers to one.
    max_concurrent_runs: 1
    tag_concurrency_limits:
      - key: "operation"
        value: "example"
        limit: 5

run_monitoring:
  enabled: true
  poll_interval_seconds: 60
  # Release concurrency pool slots if a run is cancelled (avoids deadlock with pool limit 1).
  free_slots_after_run_end_seconds: 300

run_launcher:
  module: dagster_docker
  class: DockerRunLauncher
  config:
    env_vars:
      - DAGSTER_POSTGRES_USER
      - DAGSTER_POSTGRES_PASSWORD
      - DAGSTER_POSTGRES_DB
      - DUCKDB_PATH
      - LITELLM_KEY
      - LITELLM_PROXY_BASE
      # Keep in sync with ``dagster_daemon`` ``environment`` in ``docker-compose.yaml``:
      # each name must be **set** on the daemon (even to empty) or launch_run fails.
      # ``MINIO_ROOT_*`` is forwarded for assets that resolve MinIO creds like ``storage-mcp``.
      # Optional tuning is read in user code with ``os.environ.get`` defaults.
      # **Do not** list a name here unless it is **always set** on ``dagster_daemon``
      # (e.g. in ``infra/dagster/.env``); otherwise ``launch_run`` raises "was not set".
      - MINIO_ENDPOINT
      - MINIO_ROOT_USER
      - MINIO_ROOT_PASSWORD
      - MINIO_ACCESS_KEY
      - MINIO_SECRET_KEY
      - MINIO_BUCKET
      - MINIO_SECURE
      # Landing / ``read_csv_auto`` paths under the ``data-local`` mount.
      - DATA_LOCAL_ROOT
      # DuckDB → Iceberg REST (optional).
      - ICEBERG_REST_ENDPOINT
      - ICEBERG_REST_TOKEN
      - ICEBERG_REST_WAREHOUSE
      - ICEBERG_ATTACH_ALIAS
      - ICEBERG_REST_SECRET_NAME
      - ICEBERG_REST_CLIENT_ID
      - ICEBERG_REST_CLIENT_SECRET
      - ICEBERG_REST_OAUTH_URI
    network: infra-datasynk
    container_kwargs:
      # Per-run job containers (assets). Tune if remote LLM or large I/O steps OOM.
      # https://docker-py.readthedocs.io/en/stable/containers.html — passed to ``containers.create``.
      mem_limit: "8g"
      nano_cpus: 4000000000
      # ``host.docker.internal`` lets per-run containers reach LiteLLM on the host.
      extra_hosts:
        host.docker.internal: host-gateway
      volumes:
        - /var/run/docker.sock:/var/run/docker.sock
        - /tmp/io_manager_storage:/tmp/io_manager_storage
        # Shared CSV input/output for csv_pipeline. Host path must be identical
        # across all dev machines, hence /tmp/dagster_data (auto-shared on
        # Docker Desktop). Override by editing this file if you need a different
        # location; container_kwargs.volumes does not support env interpolation.
        - /tmp/dagster_data:/opt/dagster/data
        # Same warehouse and ``/data-local`` host tree as ``dagster_user_code``.
        # ``container_kwargs.volumes`` does not support env interpolation — set this
        # absolute path to YOUR clone's ``data-local`` directory (same tree as
        # ``DATASYN_DATA_LOCAL_HOST`` in ``docker-compose.yaml``).
        - duckdb_data:/data
        # RW under ``/data-local`` (e.g. ``landing/...``) for assets that sync to MinIO.
        - /path/to/datasyn/data-local:/data-local

run_storage:
  module: dagster_postgres.run_storage
  class: PostgresRunStorage
  config:
    postgres_db:
      hostname: dagster_postgresql
      username:
        env: DAGSTER_POSTGRES_USER
      password:
        env: DAGSTER_POSTGRES_PASSWORD
      db_name:
        env: DAGSTER_POSTGRES_DB
      port: 5432

schedule_storage:
  module: dagster_postgres.schedule_storage
  class: PostgresScheduleStorage
  config:
    postgres_db:
      hostname: dagster_postgresql
      username:
        env: DAGSTER_POSTGRES_USER
      password:
        env: DAGSTER_POSTGRES_PASSWORD
      db_name:
        env: DAGSTER_POSTGRES_DB
      port: 5432

event_log_storage:
  module: dagster_postgres.event_log
  class: PostgresEventLogStorage
  config:
    postgres_db:
      hostname: dagster_postgresql
      username:
        env: DAGSTER_POSTGRES_USER
      password:
        env: DAGSTER_POSTGRES_PASSWORD
      db_name:
        env: DAGSTER_POSTGRES_DB
      port: 5432
