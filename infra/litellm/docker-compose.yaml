# Aligned with https://docs.litellm.ai/docs/proxy/deploy (Docker Compose + DB).
# Nginx runs on a separate EC2 instance; LiteLLM publishes port 4000 for that host.
#
# Co-location with ../langfuse/docker-compose.yml (same laptop/host):
#   Langfuse binds 3000, 3030, 5432, 6379, 8123, 9000, 9090, 9091 on localhost.
#   LiteLLM uses 4000 (proxy) and 5434 (Postgres on host) so nothing clashes with Langfuse.
#   Services still talk to their own DB over Docker DNS (db:5432 inside this project).

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: litellm
      POSTGRES_PASSWORD: litellm
      POSTGRES_DB: litellm
    volumes:
      - litellm-db-data:/var/lib/postgresql/data
    ports:
      - 127.0.0.1:5434:5432
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U litellm -d litellm -h localhost -p 5432"]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 15s
    restart: unless-stopped
    networks:
      - infra

  litellm:
    image: docker.litellm.ai/berriai/litellm-database:main-stable
    container_name: litellm
    depends_on:
      db:
        condition: service_healthy
    # Admin UI: use http://127.0.0.1:4000/ui/ — do not set SERVER_ROOT_PATH unless you serve under a subpath.
    # If logs show 404 for /litellm-asset-prefix/_next/..., run `docker compose pull` or put nginx-edge in front
    # (see nginx-edge/default.conf.template: rewrites that prefix to /_next/...).
    # Langfuse on the Docker host (see LANGFUSE_OTEL_HOST in .env)
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - .env
    environment:
      LITELLM_PORT: "4000"
      DATABASE_URL: postgresql://litellm:litellm@db:5432/litellm
    volumes:
      - ./config/config.yaml:/app/config.yaml:ro
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    ports:
      - "4000:4000"
    restart: unless-stopped
    networks:
      - infra

volumes:
  litellm-db-data:

networks:
  infra:
    name: infra-datasynk
    external: true