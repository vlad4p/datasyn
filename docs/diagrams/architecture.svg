<?xml version="1.0" encoding="UTF-8"?>
<svg style="background-color:#fffceb" xmlns="http://www.w3.org/2000/svg" width="880" height="640" viewBox="0 0 880 640" role="img" aria-label="Arquitectura DataSyn contenedores">
  <defs>
    <linearGradient id="client" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#b3c8cd"/><stop offset="100%" stop-color="#395a8e"/>
    </linearGradient>
    <linearGradient id="brain" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#395a8e"/><stop offset="100%" stop-color="#0e2d58"/>
    </linearGradient>
    <linearGradient id="ui" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#b3c8cd"/><stop offset="100%" stop-color="#395a8e"/>
    </linearGradient>
    <linearGradient id="duckdbMcp" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#cede9f"/><stop offset="100%" stop-color="#559778"/>
    </linearGradient>
    <linearGradient id="storageMcp" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f9dac1"/><stop offset="100%" stop-color="#de6433"/>
    </linearGradient>
    <linearGradient id="langfuse" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f4bd48"/><stop offset="100%" stop-color="#f4bd48"/>
    </linearGradient>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#585d5e"/>
    </marker>
    <marker id="arrowA" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#395a8e"/>
    </marker>
    <marker id="arrowB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#559778"/>
    </marker>
  </defs>

  <rect width="100%" height="100%" fill="#fffceb"/>
  <text x="440" y="34" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#585d5e" letter-spacing="2">ARQUITECTURA &#183; UN CONTENEDOR POR SERVICIO</text>

  <!-- Client -->
  <g transform="translate(310,48)">
    <rect width="260" height="72" rx="6" fill="#ffffff" stroke="#395a8e" stroke-width="2.5"/>
    <circle cx="36" cy="36" r="20" fill="url(#client)"/>
    <text x="36" y="42" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="bold" fill="#0e2d58">C</text>
    <text x="68" y="32" font-family="Arial,sans-serif" font-size="16" font-weight="bold" fill="#49443b">IDE / Cliente</text>
    <text x="68" y="52" font-family="Arial,sans-serif" font-size="11" fill="#585d5e">agente MCP o navegador web</text>
  </g>

  <!-- Route labels -->
  <line x1="380" y1="120" x2="280" y2="168" stroke="#395a8e" stroke-width="2.5" marker-end="url(#arrowA)"/>
  <line x1="500" y1="120" x2="600" y2="168" stroke="#559778" stroke-width="2.5" marker-end="url(#arrowB)"/>
  <rect x="108" y="128" width="118" height="22" rx="3" fill="#fffceb" stroke="#395a8e"/>
  <text x="167" y="143" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" font-weight="bold" fill="#395a8e">Ruta A: agent / UI</text>
  <rect x="654" y="128" width="118" height="22" rx="3" fill="#cede9f" stroke="#559778"/>
  <text x="713" y="143" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" font-weight="bold" fill="#559778">Ruta B: MCP directo</text>

  <!-- Route A: brain + UI containers -->
  <g transform="translate(48,168)">
    <rect width="380" height="100" rx="4" fill="#fff1ce" stroke="#49443b" stroke-width="2.5" stroke-dasharray="5 3"/>
    <text x="16" y="22" font-family="Arial,sans-serif" font-size="10" fill="#585d5e" letter-spacing="1">CONTENEDORES datasyn/ (este repo)</text>
    <g transform="translate(16,32)">
      <rect width="168" height="56" rx="4" fill="url(#brain)" stroke="#0e2d58" stroke-width="2.5"/>
      <text x="12" y="22" font-family="Arial,sans-serif" font-size="13" font-weight="bold" fill="#0e2d58">brain</text>
      <text x="12" y="38" font-family="Arial,sans-serif" font-size="10" fill="#0e2d58">FastAPI &#183; Deep Agents</text>
      <text x="12" y="50" font-family="Arial,sans-serif" font-size="9" fill="#0e2d58">:8002 &#183; llama MCP internamente</text>
    </g>
    <g transform="translate(196,32)">
      <rect width="168" height="56" rx="4" fill="url(#ui)" stroke="#395a8e" stroke-width="2.5"/>
      <text x="12" y="22" font-family="Arial,sans-serif" font-size="13" font-weight="bold" fill="#0e2d58">ui</text>
      <text x="12" y="38" font-family="Arial,sans-serif" font-size="10" fill="#0e2d58">React / Vite</text>
      <text x="12" y="50" font-family="Arial,sans-serif" font-size="9" fill="#0e2d58">:8003 &#183; proxy /api &#8594; brain</text>
    </g>
  </g>

  <!-- Langfuse side note -->
  <g transform="translate(48,278)">
    <rect width="380" height="44" rx="3" fill="#ffffff" stroke="#f4bd48" stroke-width="2" stroke-dasharray="4 3"/>
    <rect x="12" y="11" width="72" height="22" rx="6" fill="url(#langfuse)" stroke="#f2b573"/>
    <text x="48" y="26" text-anchor="middle" font-family="Arial,sans-serif" font-size="9" font-weight="bold" fill="#49443b">Langfuse</text>
    <text x="96" y="27" font-family="Arial,sans-serif" font-size="10" fill="#585d5e">Trazas server-side del brain (opcional, infra/langfuse/)</text>
  </g>

  <!-- Route B: direct MCP hint box -->
  <g transform="translate(452,168)">
    <rect width="380" height="154" rx="4" fill="#fff1ce" stroke="#559778" stroke-width="2.5" stroke-dasharray="5 3"/>
    <text x="16" y="22" font-family="Arial,sans-serif" font-size="10" fill="#585d5e" letter-spacing="1">RUTA B: CLIENTE MCP &#8594; HTTP /mcp (sin brain)</text>
    <text x="16" y="42" font-family="Arial,sans-serif" font-size="11" fill="#585d5e">El IDE configura mcp.json con URLs del host</text>
    <text x="16" y="60" font-family="Arial,sans-serif" font-size="11" fill="#585d5e">:8040 duckdb &#183; :8044 storage</text>
    <line x1="16" y1="72" x2="364" y2="72" stroke="#49443b"/>
    <text x="16" y="92" font-family="Arial,sans-serif" font-size="10" fill="#559778">Consultas SQL y objetos MinIO</text>
    <text x="16" y="110" font-family="Arial,sans-serif" font-size="10" fill="#559778">directamente desde el cliente MCP</text>
    <text x="16" y="136" font-family="Arial,sans-serif" font-size="9" fill="#585d5e">Misma red Docker infra-datasynk</text>
  </g>

  <!-- Arrows from A and B to MCP layer -->
  <line x1="238" y1="322" x2="238" y2="352" stroke="#585d5e" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="642" y1="322" x2="642" y2="352" stroke="#585d5e" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="238" y1="352" x2="440" y2="352" stroke="#585d5e" stroke-width="2"/>
  <line x1="642" y1="352" x2="440" y2="352" stroke="#585d5e" stroke-width="2"/>
  <line x1="440" y1="352" x2="440" y2="372" stroke="#585d5e" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- MCP containers row -->
  <text x="440" y="392" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#585d5e" letter-spacing="1">SERVIDORES MCP (CONTENEDORES datasyn/*-mcp)</text>

  <g transform="translate(115,404)">
    <rect width="250" height="80" rx="4" fill="#ffffff" stroke="#559778" stroke-width="2.5"/>
    <rect x="10" y="10" width="88" height="20" rx="6" fill="url(#duckdbMcp)"/>
    <text x="54" y="24" text-anchor="middle" font-family="Arial,sans-serif" font-size="9" font-weight="bold" fill="#2c695a">duckdb-mcp</text>
    <text x="14" y="48" font-family="Arial,sans-serif" font-size="12" font-weight="bold" fill="#49443b">datasyn/duckdb-mcp</text>
    <text x="14" y="64" font-family="Arial,sans-serif" font-size="10" fill="#585d5e">SQL &#183; schema &#183; /data-local</text>
    <text x="14" y="76" font-family="Arial,sans-serif" font-size="9" fill="#585d5e">:8040/mcp &#183; infra/duckdb/</text>
  </g>

  <g transform="translate(515,404)">
    <rect width="250" height="80" rx="4" fill="#ffffff" stroke="#de6433" stroke-width="2.5"/>
    <rect x="10" y="10" width="88" height="20" rx="6" fill="url(#storageMcp)"/>
    <text x="54" y="24" text-anchor="middle" font-family="Arial,sans-serif" font-size="9" font-weight="bold" fill="#6c2b3b">storage-mcp</text>
    <text x="14" y="48" font-family="Arial,sans-serif" font-size="12" font-weight="bold" fill="#49443b">datasyn/storage-mcp</text>
    <text x="14" y="64" font-family="Arial,sans-serif" font-size="10" fill="#585d5e">MinIO list/get/put</text>
    <text x="14" y="76" font-family="Arial,sans-serif" font-size="9" fill="#585d5e">:8044/mcp &#183; infra/object-storage/</text>
  </g>

  <!-- arrows to data plane -->
  <line x1="240" y1="484" x2="165" y2="508" stroke="#49443b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="640" y1="484" x2="440" y2="508" stroke="#49443b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Data plane containers -->
  <text x="440" y="528" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#585d5e" letter-spacing="1">PLANO DE DATOS (CONTENEDORES)</text>

  <g transform="translate(40,538)">
    <rect width="250" height="72" rx="4" fill="#fff1ce" stroke="#49443b" stroke-width="2.5"/>
    <text x="14" y="26" font-family="Arial,sans-serif" font-size="13" font-weight="bold" fill="#49443b">DuckDB warehouse</text>
    <text x="14" y="44" font-family="Arial,sans-serif" font-size="10" fill="#585d5e">warehouse.duckdb &#183; vol duckdb_data</text>
    <text x="14" y="60" font-family="Arial,sans-serif" font-size="9" fill="#585d5e">schemas bronze / silver / gold</text>
  </g>

  <g transform="translate(315,538)">
    <rect width="250" height="72" rx="4" fill="#fff1ce" stroke="#49443b" stroke-width="2.5"/>
    <text x="14" y="26" font-family="Arial,sans-serif" font-size="13" font-weight="bold" fill="#49443b">MinIO</text>
    <text x="14" y="44" font-family="Arial,sans-serif" font-size="10" fill="#585d5e">datasyn-object-minio :9000</text>
    <text x="14" y="60" font-family="Arial,sans-serif" font-size="9" fill="#585d5e">bucket data-local</text>
  </g>

  <g transform="translate(590,538)">
    <rect width="250" height="72" rx="4" fill="#fff1ce" stroke="#e3b09b" stroke-width="2.5"/>
    <text x="14" y="26" font-family="Arial,sans-serif" font-size="13" font-weight="bold" fill="#49443b">Dagster runtime</text>
    <text x="14" y="44" font-family="Arial,sans-serif" font-size="10" fill="#585d5e">webserver &#183; daemon &#183; Postgres</text>
    <text x="14" y="60" font-family="Arial,sans-serif" font-size="9" fill="#585d5e">gRPC user code &#8592; ../datasyn-code</text>
  </g>

  <rect x="200" y="618" width="480" height="1" fill="#49443b"/>
  <text x="440" y="632" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="#585d5e">Red compartida infra-datasynk &#183; cada caja = contenedor Docker independiente</text>
</svg>
