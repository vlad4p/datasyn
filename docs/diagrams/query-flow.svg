    <text x="80" y="52" font-family="Arial,sans-serif" font-size="11" fill="#585d5e">duckdb_get_schema &#183; duckdb_execute_query &#183; storage_*</text>
  </g>
  <line x1="260" y1="288" x2="260" y2="308" stroke="#395a8e" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/>

