    <text x="110" y="26" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="bold" fill="#49443b">MCP directo</text>
    <text x="110" y="44" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="#585d5e">duckdb / storage</text>
    <text x="110" y="58" text-anchor="middle" font-family="Arial,sans-serif" font-size="9" fill="#585d5e">:8040 / :8044</text>
  </g>

  <line x1="260" y1="192" x2="260" y2="216" stroke="#395a8e" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/>

  <g transform="translate(60,216)">
