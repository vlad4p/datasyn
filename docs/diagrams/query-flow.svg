<?xml version="1.0" encoding="UTF-8"?>
<svg style="background-color:#fffceb" xmlns="http://www.w3.org/2000/svg" width="520" height="580" viewBox="0 0 520 580" role="img" aria-label="Flujo de consulta dos rutas">
  <defs>
    <linearGradient id="ai" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#b3c8cd"/><stop offset="100%" stop-color="#395a8e"/></linearGradient>
    <linearGradient id="done" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#cede9f"/><stop offset="100%" stop-color="#559778"/></linearGradient>
    <linearGradient id="sql" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#cede9f"/><stop offset="100%" stop-color="#559778"/></linearGradient>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#395a8e"/></marker>
  </defs>
  <rect width="100%" height="100%" fill="#fffceb"/>
  <text x="260" y="34" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#585d5e" letter-spacing="2">CICLO DE UNA CONSULTA</text>

  <g transform="translate(60,48)">
    <rect width="400" height="56" rx="4" fill="#ffffff" stroke="#395a8e" stroke-width="2.5"/>
    <text x="200" y="24" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="bold" fill="#49443b">IDE / Cliente</text>
    <text x="200" y="42" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#585d5e">UI web (:8003) o cliente MCP nativo</text>
  </g>

  <line x1="180" y1="104" x2="130" y2="128" stroke="#395a8e" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="340" y1="104" x2="390" y2="128" stroke="#559778" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="130" y="120" text-anchor="middle" font-family="Arial,sans-serif" font-size="9" fill="#395a8e">Ruta A</text>
  <text x="390" y="120" text-anchor="middle" font-family="Arial,sans-serif" font-size="9" fill="#559778">Ruta B</text>

  <g transform="translate(20,128)">
