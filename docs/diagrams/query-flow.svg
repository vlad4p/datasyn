    <rect x="300" y="20" width="84" height="32" rx="3" fill="url(#sql)" stroke="#2c695a"/>
    <text x="342" y="40" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" font-weight="bold" fill="#2c695a">SQL</text>
    <text x="80" y="32" font-family="Arial,sans-serif" font-size="14" font-weight="bold" fill="#49443b">duckdb-mcp &#8594; DuckDB</text>
    <text x="80" y="52" font-family="Arial,sans-serif" font-size="11" fill="#585d5e">Un statement por llamada &#183; contenedor a contenedor</text>
  </g>
  <line x1="260" y1="380" x2="260" y2="400" stroke="#559778" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/>

  <g transform="translate(60,400)">
