    <text x="110" y="44" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="#585d5e">AGENTS.md &#183; skills</text>
    <text x="110" y="58" text-anchor="middle" font-family="Arial,sans-serif" font-size="9" fill="#585d5e">contenedores datasyn/</text>
