    <text x="200" y="24" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" font-weight="bold" fill="#d15c32">Langfuse (opcional)</text>
    <text x="200" y="42" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="#585d5e">Trazas server-side en Ruta A (brain &#8594; Langfuse)</text>
  </g>
  <line x1="260" y1="456" x2="260" y2="476" stroke="#559778" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/>

  <g transform="translate(60,476)">
    <rect width="400" height="72" rx="6" fill="url(#done)" stroke="#559778" stroke-width="2.5"/>
    <circle cx="44" cy="36" r="22" fill="#2c695a"/>
    <path d="M36,36 L42,42 L54,28" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="80" y="32" font-family="Arial,sans-serif" font-size="14" font-weight="bold" fill="#fffceb">Respuesta auditable</text>
    <text x="80" y="52" font-family="Arial,sans-serif" font-size="11" fill="#559778">Tabla Markdown &#183; SQL fenced &#183; supuestos</text>
