<?xml version="1.0" encoding="UTF-8"?>
<svg style="background-color:#fffceb" xmlns="http://www.w3.org/2000/svg" width="720" height="280" viewBox="0 0 720 280" role="img" aria-label="Layout distribuido dos repos">
  <defs>
    <linearGradient id="platform" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#7facc6"/><stop offset="100%" stop-color="#fff1ce"/></linearGradient>
    <linearGradient id="code" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#b3c8cd"/><stop offset="100%" stop-color="#e3b09b"/></linearGradient>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#585d5e"/></marker>
  </defs>
  <rect width="100%" height="100%" fill="#fffceb"/>
  <text x="360" y="32" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#585d5e" letter-spacing="2">DESPLIEGUE DISTRIBUIDO DAGSTER</text>
  <g transform="translate(40,52)">
    <rect width="300" height="180" rx="6" fill="url(#platform)" stroke="#395a8e" stroke-width="2.5"/>
    <text x="16" y="32" font-family="Arial,sans-serif" font-size="16" font-weight="bold" fill="#7facc6">datasyn/</text>
    <text x="16" y="54" font-family="Arial,sans-serif" font-size="11" fill="#585d5e">Brain &#183; UI &#183; skills &#183; infra</text>
    <line x1="16" y1="68" x2="284" y2="68" stroke="#49443b"/>
    <text x="16" y="88" font-family="Arial,sans-serif" font-size="11" fill="#585d5e">infra/dagster/</text>
    <text x="16" y="106" font-family="Arial,sans-serif" font-size="10" fill="#585d5e">webserver &#183; daemon &#183; Postgres</text>
    <text x="16" y="128" font-family="Arial,sans-serif" font-size="11" fill="#585d5e">duckdb-mcp &#183; storage-mcp</text>
    <text x="16" y="148" font-family="Arial,sans-serif" font-size="10" fill="#585d5e">:8040 / :8044 HTTP MCP</text>
    <text x="16" y="168" font-family="Arial,sans-serif" font-size="10" fill="#585d5e">make stack-up &#183; make infra-up</text>
  </g>
  <line x1="340" y1="142" x2="380" y2="142" stroke="#49443b" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="360" y="132" text-anchor="middle" font-family="Arial,sans-serif" font-size="9" fill="#585d5e">gRPC user code</text>
  <g transform="translate(380,52)">
    <rect width="300" height="180" rx="6" fill="url(#code)" stroke="#e3b09b" stroke-width="2.5"/>
    <text x="16" y="32" font-family="Arial,sans-serif" font-size="16" font-weight="bold" fill="#6c2b3b">datasyn-code/</text>
    <text x="16" y="54" font-family="Arial,sans-serif" font-size="11" fill="#6c2b3b">User code location (repo hermano)</text>
    <line x1="16" y1="68" x2="284" y2="68" stroke="#e3b09b" opacity="0.5"/>
    <text x="16" y="88" font-family="Arial,sans-serif" font-size="11" fill="#49443b">src/datasyn/assets/</text>
    <text x="16" y="106" font-family="Arial,sans-serif" font-size="10" fill="#6c2b3b">jobs &#183; schedules &#183; Dockerfile</text>
    <text x="16" y="128" font-family="Arial,sans-serif" font-size="10" fill="#585d5e">gRPC dagster_user_code</text>
    <text x="16" y="148" font-family="Arial,sans-serif" font-size="10" fill="#585d5e">nueva ingesta &#8594; gitflow + make push</text>
    <text x="16" y="168" font-family="Arial,sans-serif" font-size="10" fill="#585d5e">skills en datasyn/ + agente MCP</text>
  </g>
  <text x="360" y="258" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#585d5e">Clonar dos repos al mismo nivel &#183; compose construye user code desde ../datasyn-code</text>
</svg>
